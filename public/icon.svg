<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- DIN Rail Symbol (Trilho DIN 35mm Profile) -->
  <path d="M 64 256 L 448 256" stroke="url(#railGrad)" stroke-width="28" stroke-linecap="round"/>
  <rect x="88" y="246" width="336" height="20" rx="4" fill="#cbd5e1" opacity="0.9"/>
  <!-- DIN slots -->
  <rect x="120" y="251" width="36" height="10" rx="5" fill="#1e293b"/>
  <rect x="200" y="251" width="36" height="10" rx="5" fill="#1e293b"/>
  <rect x="276" y="251" width="36" height="10" rx="5" fill="#1e293b"/>
  <rect x="356" y="251" width="36" height="10" rx="5" fill="#1e293b"/>

  <!-- Electrical Enclosure / Switchboard Outline -->
  <rect x="112" y="96" width="288" height="320" rx="24" fill="#090d16" stroke="#38bdf8" stroke-width="12" opacity="0.95"/>
  <rect x="128" y="112" width="256" height="288" rx="16" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Central Industrial Lightning Bolt with Glow -->
  <path d="M 284 136 L 180 272 L 256 272 L 228 376 L 332 240 L 256 240 Z" 
        fill="url(#boltGrad)" 
        stroke="#7dd3fc" 
        stroke-width="6" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Terminal Connection Points -->
  <circle cx="160" cy="112" r="10" fill="#f59e0b"/>
  <circle cx="216" cy="112" r="10" fill="#f59e0b"/>
  <circle cx="296" cy="112" r="10" fill="#f59e0b"/>
  <circle cx="352" cy="112" r="10" fill="#f59e0b"/>

  <circle cx="160" cy="400" r="10" fill="#10b981"/>
  <circle cx="216" cy="400" r="10" fill="#10b981"/>
  <circle cx="296" cy="400" r="10" fill="#10b981"/>
  <circle cx="352" cy="400" r="10" fill="#10b981"/>
</svg>
